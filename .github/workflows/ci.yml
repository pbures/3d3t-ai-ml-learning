name: CI/CD — Tests, 90% Coverage Gate & ArgoCD GitOps Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test-and-coverage:
    name: Go Unit & Integration Tests (>= 90% Coverage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build binaries
        run: go build -v ./cmd/...

      - name: Run Unit & Integration Tests with Race Detector and Coverage
        run: |
          go test -v -race ./internal/... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Enforce >= 90% Code Coverage Threshold
        run: |
          TOTAL_COV=$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)
          echo "Detected total statement coverage: ${TOTAL_COV}%"
          awk -v cov="$TOTAL_COV" 'BEGIN {
            if (cov + 0 < 90.0) {
              printf "::error::Code coverage %.1f%% is below the required 90.0%% threshold!\n", cov
              exit 1
            }
            printf "Code coverage check passed: %.1f%% >= 90.0%%\n", cov
          }'

  build-and-update-argocd:
    name: Build GHCR Image & Update ArgoCD Deploy Branch
    needs: test-and-coverage
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        env:
          IMAGE_REPO: ghcr.io/pbures/3d3t-ai-ml-learning
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG_SHA="${IMAGE_REPO}:sha-${SHORT_SHA}"
          TAG_LATEST="${IMAGE_REPO}:latest"

          docker build -t "${TAG_SHA}" -t "${TAG_LATEST}" .
          docker push "${TAG_SHA}"
          docker push "${TAG_LATEST}"

          echo "IMAGE_TAG=${TAG_SHA}" >> $GITHUB_ENV

      - name: Update Kubernetes manifest & push to ArgoCD deploy branch
        run: |
          sed -i "s|image: ghcr.io/pbures/3d3t-ai-ml-learning:.*|image: ${IMAGE_TAG}|g" k8s/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B deploy
          git add k8s/ argocd/
          git commit -m "Deploy ${IMAGE_TAG} to ArgoCD" || true
          git push -f origin deploy
