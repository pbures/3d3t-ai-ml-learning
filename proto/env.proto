syntax = "proto3";

package env3t3d.v1;

option go_package = "github.com/pbures/3d3t-ai-ml-learning/internal/grpcserver/pb;pb";

// EnvService provides both single-game inspection/testing RPCs and
// high-throughput vectorized environment stepping for Neural Network RL training.
service EnvService {
  // Single-game RPCs (used for rule verification, evaluation, and interactive debugging)
  rpc Reset(ResetRequest) returns (GameState);
  rpc Step(StepRequest) returns (StepResponse);
  rpc GetState(GetStateRequest) returns (GameState);
  rpc GetWinLines(Empty) returns (WinLinesResponse);

  // Vectorized environment RPCs (used for high-speed batched RL training)
  rpc InitPool(InitPoolRequest) returns (BatchStateResponse);
  rpc ResetPool(ResetPoolRequest) returns (BatchStateResponse);
  rpc BatchStep(BatchStepRequest) returns (BatchStepResponse);
}

message Empty {}

message ResetRequest {
  string game_id = 1;
}

message GetStateRequest {
  string game_id = 1;
}

message StepRequest {
  string game_id = 1;
  uint32 action = 2; // Column index a = 4*y + x in {0..15}
}

message MoveCoord {
  uint32 action = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 z = 4;
  uint32 player = 5;
  uint32 move_number = 6;
}

message GameState {
  string game_id = 1;
  uint64 white_bitboard = 2;
  uint64 black_bitboard = 3;
  uint32 current_player = 4;     // 1 = WHITE, 2 = BLACK
  uint32 status = 5;             // 0 = ONGOING, 1 = WHITE_WON, 2 = BLACK_WON, 3 = DRAW
  uint32 winner = 6;             // 0 = NONE, 1 = WHITE, 2 = BLACK
  uint64 win_line_mask = 7;      // 64-bit mask of the 4 winning positions (0 if none)
  int32 win_line_index = 8;      // Index into [0..75] winning lines (-1 if none)
  uint32 valid_moves_mask = 9;   // 16-bit bitmask of legal actions {0..15}
  uint32 move_count = 10;        // Number of plies played (0..64)
  bytes canonical_tensor = 11;   // 192 bytes: [3][4][4][4] (MyPieces, OpponentPieces, GravitySurface)
  repeated MoveCoord history = 12;
}

message StepResponse {
  GameState state = 1;
  MoveCoord last_move = 2;
  float reward = 3;              // +1.0 if moving player won, 0.0 otherwise
  bool done = 4;                 // true if status != ONGOING
}

message WinLineInfo {
  int32 index = 1;
  string category = 2;           // Orthogonal-X, Orthogonal-Y, Orthogonal-Z, Diag-XY, Diag-XZ, Diag-YZ, Diag-XYZ
  uint64 mask = 3;
  repeated MoveCoord coords = 4; // The 4 (x, y, z) coordinates on this line
}

message WinLinesResponse {
  repeated WinLineInfo lines = 1;
}

// Vectorized Batch Messages

message InitPoolRequest {
  uint32 num_envs = 1;
}

message ResetPoolRequest {
  repeated uint32 env_ids = 1;   // Empty means reset all environments in the pool
}

message BatchStateResponse {
  uint32 num_envs = 1;
  bytes observations = 2;        // Packed N * 192 bytes: [N][3][4][4][4] uint8 (0 or 1)
  repeated uint32 valid_masks = 3; // N elements, each a 16-bit legal move mask
  repeated uint32 current_players = 4; // N elements (1 = WHITE, 2 = BLACK)
}

message BatchStepRequest {
  bytes actions = 1;             // N bytes: action[i] in {0..15} for environment i
}

message BatchStepResponse {
  uint32 num_envs = 1;
  bytes observations = 2;        // Packed N * 192 bytes (post-step, or initial state if auto-reset on done)
  bytes terminal_observations = 3; // Packed N * 192 bytes of terminal states before auto-reset
  repeated float rewards = 4;    // N rewards (+1.0 for winning move, 0.0 for draw/ongoing)
  repeated bool dones = 5;       // N booleans indicating episode termination on this step
  repeated uint32 winners = 6;   // N winners (0 = NONE/DRAW, 1 = WHITE, 2 = BLACK)
  repeated uint32 valid_masks = 7; // N 16-bit masks for the next turn
  repeated uint32 current_players = 8; // N active players for the next turn
  repeated uint64 win_line_masks = 9; // N winning line bitmasks (non-zero when won)
}
