<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3T3D Arena API — OpenAPI 3.1 Specification & Interactive Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .topbar-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    .topbar-banner h1 {
      font-size: 1.05rem;
      margin: 0;
      color: #38bdf8;
    }
    .topbar-links {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
    }
    .topbar-links a {
      color: #f8fafc;
      text-decoration: none;
      background: #334155;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
    }
    .topbar-links a:hover {
      background: #0284c7;
      border-color: #38bdf8;
    }
    #swagger-ui {
      background: #ffffff;
      min-height: calc(100vh - 52px);
    }
  </style>
</head>
<body>
  <div class="topbar-banner">
    <h1>3T3D — 3D Gravity Tic-Tac-Toe Arena OpenAPI 3.1 Documentation</h1>
    <div class="topbar-links">
      <a href="/">← Back to 3D Arena UI</a>
      <a href="/openapi.json" target="_blank">openapi.json</a>
      <a href="/openapi.yaml" target="_blank">openapi.yaml</a>
    </div>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis]
      });
    };
  </script>
</body>
</html>
